title: Cecil Desktop
baseline: The desktop app for Cecil
baseurl: https://desktop.cecil.app/
description: Manage, build, preview and publish your Cecil static sites from a native desktop app, without the terminal.
image: images/screenshots/sites.png
author:
  name: Aperture Lab
  url: https://aperturelab.fr
language: en
languages:
  - code: en
    name: English
    locale: en_US
  - code: fr
    name: Français
    locale: fr_FR
    config:
      baseline: L'application desktop pour Cecil
      description: Gérez, buildez, prévisualisez et publiez vos sites statiques Cecil depuis une application desktop native, sans terminal.
      menus:
        main:
          - id: index
            name: Accueil
          - id: docs
            name: Documentation
            url: /fr/docs/
            weight: 10
          - id: download
            name: Télécharger
            url: /fr/#download
            weight: 20
        footer:
          - id: credits
            name: Crédits
            url: /fr/credits/
          - id: terms
            name: Conditions d'utilisation
            url: /fr/terms/
          - id: privacy
            name: Confidentialité
            url: /fr/privacy/
          - id: legal
            name: Mentions légales
            url: /fr/legal/
menus:
  main:
    - id: index
      name: Home
    - id: docs
      name: Documentation
      url: /docs/
      weight: 10
    - id: download
      name: Download
      url: /#download
      weight: 20
  footer:
    - id: credits
      name: Credits
      url: /credits/
    - id: terms
      name: Terms
      url: /terms/
    - id: privacy
      name: Privacy
      url: /privacy/
    - id: legal
      name: Legal notice
      url: /legal/

# custom options, used by the templates
download:
  url: /download/ # redirected to the R2 bucket (see `netlify.redirects`)
  manifests: https://pub-530b20baba974fa4997de33fa2bed14e.r2.dev/desktop/ # electron-builder update files
  platforms: # the first one gives the version: the others are shown only for the same version
    - name: Windows
      manifest: latest.yml
      ext: exe
      archs: # label of the architecture found in the installer file name
        arm64: ARM64
        x64: x64
    - name: macOS
      manifest: latest-mac.yml
      ext: dmg
      archs:
        arm64: Apple Silicon
        x64: Intel
        universal: Universal
      default_arch: Intel # file name without architecture (electron-builder)

theme:
  - docs       # layouts of the documentation (`pages/docs/`); the homepage keeps `layouts/index.html.twig`
  - flexsearch # search in the documentation
  - netlify
  - pwa

# documentation (Docs theme)
logo: images/logo.png
docs:
  sidebar:
    collapsed: true
  github: # "Edit this page" link
    repo: https://github.com/Cecilapp/desktop-website
    branch: main
    path: pages

flexsearch:
  sections:
    docs:
      limit: 8

netlify:
  redirects:
    - from: /download/*
      to: https://pub-530b20baba974fa4997de33fa2bed14e.r2.dev/desktop/:splat
      status: 302

pwa:
  manifest:
    theme_color: '#1f4762'
    theme_color_dark: '#132e42'

taxonomies:
  tags: disabled # no blog
pages:
  body:
    images:
      dark_suffix: .dark # e.g. `sites.dark.png` is the dark variant of `sites.png` (as `layouts.images.dark_suffix`)
output:
  pagetypeformats:
    homepage: [html]
metatags:
  title:
    divider: " · "
layouts:
  images:
    dark_suffix: .dark # e.g. `sites.dark.png` is the dark variant of `sites.png`
