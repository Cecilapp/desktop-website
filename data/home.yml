hero:
  beta: Beta · The current version is in beta testing
  title: Write, preview, publish. <span class="text-gold-400">No command line</span>.
  text: "A native desktop app to manage and build your static sites. Cecil is embedded: nothing else to install."
  note: Free for 1 site · Windows and macOS
  screenshot:
    image: images/screenshots/overview.png
    alt: Cecil Desktop overview of a site, with the last build, the preview and the publication status

intro:
  title: Everything Cecil does, one click away.
  text: Build logs, live preview, Markdown editor and deployments in one window. Raw configuration and detailed logs stay visible.

features:
  - title: Write content, see it live
    text: Browse the `pages/` tree, edit Markdown with syntax highlighting and fill the front matter through a form. Save, and the preview reloads in your browser.
    points:
      - Markdown editor with line numbers
      - Front matter form, raw YAML for the rest
      - Open any page in your external editor
    screenshot:
      image: images/screenshots/content.png
      alt: Markdown editor with the pages tree and the front matter form
  - title: Publish in one click
    text: Deploy to Netlify, Vercel, GitHub Pages or AWS S3 directly through their APIs. Only the changed files are sent, and every deployment is kept in the history.
    points:
      - Several targets per site (production, staging…)
      - Differential uploads
      - No git, Netlify or AWS CLI required
    screenshot:
      image: images/screenshots/publish.png
      alt: Netlify publishing target, with the deployments history
  - title: Your tokens stay safe
    text: Hosting accounts are stored once and shared between your sites. Tokens are encrypted with the system keychain and never written to your projects.
    points:
      - Windows Credential Manager and macOS Keychain
      - Tokens checked before each deployment
      - No telemetry
    screenshot:
      image: images/screenshots/accounts.png
      alt: Preferences listing the Netlify account, with its token checked

more:
  title: And everything you expect.
  items:
    - icon: build
      title: Full or incremental builds
      text: Drafts, environment, base URL… with streamed logs and a summary per step.
    - icon: preview
      title: Live preview
      text: A local server with live reload, opened in your browser. One per site.
    - icon: sites
      title: All your sites
      text: Open an existing project or create a new one, and switch between them.
    - icon: themes
      title: Themes
      text: Browse, install and update the official Cecil themes.
    - icon: doctor
      title: Diagnostics
      text: Deprecated options, broken links and SEO checks, with readable errors.
    - icon: shortcuts
      title: Keyboard first
      text: Command palette, Ctrl/Cmd+B to build, Ctrl/Cmd+P to preview.

